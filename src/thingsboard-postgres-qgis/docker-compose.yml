services:
  postgres:
    image: postgres:14
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: thingsboard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_net

  fetcher:
    build:
      context: ./fetcher
    container_name: fetcher
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # ThingsBoard config
      THINGSBOARD_URL: "https://thingsboard.cloud"
      DEVICE_ID: ${DEVICE_ID}
      JWT_TOKEN: ${JWT_TOKEN}"
      KEYS: "temp,hum,light,wind"

      # PostgreSQL config
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: 5432
      POSTGRES_DB: "thingsboard"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    networks:
      - app_net

volumes:
  postgres_data:

networks:
  app_net:
    driver: bridge
